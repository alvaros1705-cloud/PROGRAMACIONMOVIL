name: mindfulphone
description: App para el Uso Responsable del Celular – MindfulPhone
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore:
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  animate_do: ^3.3.4
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  provider: ^6.1.2
  percent_indicator: ^4.2.3
  audioplayers: ^6.1.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1      # ← ESTO FALTABA
  flutter_native_splash: ^2.4.1        # ← ESTO FALTABA

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/logo.png               # ← para que encuentre assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0D0B2A"
  image: assets/logo.png
  android: true
  ios: true
  fullscreen: true