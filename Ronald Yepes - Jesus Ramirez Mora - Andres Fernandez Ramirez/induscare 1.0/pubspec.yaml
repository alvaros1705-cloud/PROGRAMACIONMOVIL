name: induscare
description: An offline device maintenance management app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  file_picker: ^8.0.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  lottie: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
